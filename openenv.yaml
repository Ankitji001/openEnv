version: "1.0"
name: "email-triage-env"
description: "A real-world email triage system Environment for openenv"
entry_point: "env.environment:EmailTriageEnv"
tasks:
  - id: "easy"
    description: "Classify an email into spam, urgent, or normal. Exact match scoring."
    grader: "env.grader:grade_easy_eval"
    score: 0.33
  - id: "medium"
    description: "Classify an email, assign a priority, and choose an action. Weighted score combination."
    grader: "env.grader:grade_medium_eval"
    score: 0.33 
  - id: "hard"
    description: "Process a queue of multiple emails sequentially, maintaining state, avoiding repeated or invalid actions."
    grader: "env.grader:grade_hard_eval"
    score: 0.34
dependencies:
  - "pydantic>=2.0.0"
